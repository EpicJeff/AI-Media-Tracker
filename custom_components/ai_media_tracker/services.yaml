process_test_image:
  name: AI Media Tracker - Process Test Image
  description: Sends a local file frame to your configured Ollama VLM instance and pushes the structured telemetry attributes down to the specified media player proxy.
  target:
    entity:
      integration: ai_media_tracker
      domain: media_player
  fields:
    image_path:
      name: Local Image File Path
      description: Complete file system path tracking where your static test show photo lives.
      required: true
      example: "/config/www/images/test_sports_match.jpg"
follow_me:
  name: AI Media Tracker - Follow Me
  description: Cast the active RTSP stream from this room to any other cast-enabled receiver.
  target:
    entity:
      integration: ai_media_tracker
      domain: media_player
  fields:
    target_receivers:
      name: Target Receivers
      description: Entity ID(s) of the cast receiver(s) to send the stream to.
      required: true
      selector:
        entity:
          domain: media_player
          multiple: true